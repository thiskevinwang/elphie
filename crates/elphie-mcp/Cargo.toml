[package]
name = "elphie-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
elphie-core = { path = "../elphie-core" }
elphie-oauth = { path = "../elphie-oauth" }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "auth", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "time"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt"] }
